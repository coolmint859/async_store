[package]
name = "resource-store"
description = "A lightweight, TTL-based, async resource storage and task handler created on top of tokio."
license = "MIT"
keywords = ["async", "game-engine", "resource-manager", "tokio", ""]
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"]}
futures-util = "0.3.34"
