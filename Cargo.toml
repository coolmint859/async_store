[package]
name = "async-store"
version = "0.3.0"
edition = "2024"
description = "A lightweight, TTL-based, async resource storage and lifecycle handler built on top of tokio."
license = "MIT"
repository = "https://github.com/coolmint859/async_store"
readme = "README.md"
keywords = ["async", "game-engine", "resource-manager", "tokio", "concurrency"]
categories = ["concurrency", "game-development"]

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"]}
futures-util = "0.3.34"
